<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stage">
    <!-- 手机外壳 -->
    <div class="phone">
      <div class="bezel"></div>
      <div class="screen">
        <!-- 状态栏 -->
        <div class="statusbar">
          <span class="status-time">9:41</span>
          <span class="status-icons">
            <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor" aria-hidden="true">
              <rect x="0" y="4" width="3" height="8" rx="0.6"/>
              <rect x="4.5" y="2.5" width="3" height="9.5" rx="0.6"/>
              <rect x="9" y="0.5" width="3" height="11.5" rx="0.6"/>
              <rect x="13.5" y="0" width="3" height="12" rx="0.6" opacity="0.25"/>
            </svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
              <path d="M8 2.2c2.4 0 4.5 1 6 2.6L15.3 3.5C13.5 1.3 11 0 8 0S2.5 1.3.7 3.5L2 4.8C3.5 3.2 5.6 2.2 8 2.2z"/>
              <path d="M8 5.2c1.6 0 3 .7 4.1 1.8L13.4 5.7C12 4.1 10.1 3.1 8 3.1S4 4.1 2.6 5.7L3.9 7C5 5.9 6.4 5.2 8 5.2z"/>
              <circle cx="8" cy="10.5" r="1.5"/>
            </svg>
            <span class="battery"><span class="battery-fill"></span></span>
          </span>
        </div>
        <!-- 灵动岛 -->
        <div class="island-row"><div class="island"></div></div>

        <!-- 页面内容（后续由 js 渲染） -->
        <main id="view" class="view">
          <div class="empty"><div class="big">🏗️</div><p class="t1">页面开发中</p></div>
        </main>

        <!-- 底部导航（由 js 渲染） -->
        <nav id="bottomnav" class="bottomnav"></nav>
      </div>
    </div>

    <!-- 宽屏侧边说明 -->
    <aside class="side">
      <div>
        <p class="side-kicker">校园失物招领</p>
        <h2 class="side-title">校园<br>失物招领</h2>
      </div>
      <div class="side-block">
        <p class="side-strong">可体验的主要流程：</p>
        <p>① 首页浏览失物招领信息</p>
        <p>② 点击卡片 → 查看详情</p>
        <p>③ 发布 → 填写表单 → 提交</p>
        <p>④ 搜索 → 输入关键词</p>
        <p>⑤ 我的 → 管理已发布信息</p>
      </div>
      <div class="side-block side-legend">
        <p><span class="dot dot-amber"></span>失物信息</p>
        <p><span class="dot dot-emerald"></span>招领信息</p>
      </div>
    </aside>
  </div>

  <!-- 全局提示 -->
  <div id="toast" class="toast hidden"></div>

  <!-- 普通 script 按依赖顺序加载，不使用 ES module，可直接以 file:// 打开 -->
  <script defer src="js/core.js"></script>
  <script defer src="js/storage.js"></script>
</body>
</html>
