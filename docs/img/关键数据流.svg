<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="PingFang SC, Microsoft YaHei, Hiragino Sans GB, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="980" height="560" fill="#F8FAFC"/>
  <text x="40" y="38" font-size="18" font-weight="700" fill="#0F172A">关键数据流：所有页面读写同一份数据</text>
  <text x="40" y="60" font-size="12" fill="#64748B">三层分离：页面层只负责渲染，数据规则是可独立测试的纯函数，持久层统一负责读写、权限与护栏</text>

  <!-- 页面层 -->
  <rect x="40" y="90" width="230" height="330" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="155" y="118" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">页面层（UI 渲染）</text>
  <rect x="60" y="134" width="190" height="46" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="155" y="154" font-size="12" font-weight="600" fill="#1D4ED8" text-anchor="middle">首页 / 发布 / 成功页</text>
  <text x="155" y="170" font-size="10" fill="#3B82F6" text-anchor="middle">js/app.js</text>
  <rect x="60" y="192" width="190" height="46" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="155" y="212" font-size="12" font-weight="600" fill="#1D4ED8" text-anchor="middle">搜索页</text>
  <text x="155" y="228" font-size="10" fill="#3B82F6" text-anchor="middle">js/pages/search.js</text>
  <rect x="60" y="250" width="190" height="46" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="155" y="270" font-size="12" font-weight="600" fill="#1D4ED8" text-anchor="middle">详情页</text>
  <text x="155" y="286" font-size="10" fill="#3B82F6" text-anchor="middle">js/pages/detail.js</text>
  <rect x="60" y="308" width="190" height="46" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="155" y="328" font-size="12" font-weight="600" fill="#1D4ED8" text-anchor="middle">我的发布</text>
  <text x="155" y="344" font-size="10" fill="#3B82F6" text-anchor="middle">js/pages/my-posts.js</text>
  <text x="155" y="392" font-size="10" fill="#94A3B8" text-anchor="middle">输入一律经 escapeHtml 转义</text>
  <text x="155" y="408" font-size="10" fill="#94A3B8" text-anchor="middle">卡片渲染器全站共用</text>

  <!-- 持久层 -->
  <rect x="380" y="90" width="260" height="330" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <text x="510" y="118" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">持久层 Storage（store 单例）</text>
  <rect x="400" y="134" width="220" height="46" rx="10" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2"/>
  <text x="510" y="154" font-size="12" font-weight="600" fill="#0369A1" text-anchor="middle">load / add / toggle</text>
  <text x="510" y="170" font-size="10" fill="#0284C7" text-anchor="middle">唯一数据出入口</text>
  <rect x="400" y="192" width="220" height="46" rx="10" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2"/>
  <text x="510" y="212" font-size="12" font-weight="600" fill="#0369A1" text-anchor="middle">ownerId 发布者权限校验</text>
  <text x="510" y="228" font-size="10" fill="#0284C7" text-anchor="middle">非本人操作拒绝并报错</text>
  <rect x="400" y="250" width="220" height="46" rx="10" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2"/>
  <text x="510" y="270" font-size="12" font-weight="600" fill="#0369A1" text-anchor="middle">写入失败自动回滚</text>
  <text x="510" y="286" font-size="10" fill="#0284C7" text-anchor="middle">不谎报保存成功</text>
  <rect x="400" y="308" width="220" height="46" rx="10" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2"/>
  <text x="510" y="328" font-size="12" font-weight="600" fill="#0369A1" text-anchor="middle">坏数据护栏</text>
  <text x="510" y="344" font-size="10" fill="#0284C7" text-anchor="middle">损坏回退演示数据 · 逐条过滤</text>
  <text x="510" y="392" font-size="10" fill="#94A3B8" text-anchor="middle">js/storage.js</text>

  <!-- 数据规则层 -->
  <rect x="700" y="90" width="240" height="330" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="820" y="118" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">数据规则层 Core（纯函数）</text>
  <rect x="720" y="134" width="200" height="46" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
  <text x="820" y="154" font-size="12" font-weight="600" fill="#B45309" text-anchor="middle">validatePost 表单校验</text>
  <text x="820" y="170" font-size="10" fill="#D97706" text-anchor="middle">必填 / 超长 / 非法分类</text>
  <rect x="720" y="192" width="200" height="46" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
  <text x="820" y="212" font-size="12" font-weight="600" fill="#B45309" text-anchor="middle">searchItems 组合检索</text>
  <text x="820" y="228" font-size="10" fill="#D97706" text-anchor="middle">关键词 × 分类 × 状态</text>
  <rect x="720" y="250" width="200" height="46" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
  <text x="820" y="270" font-size="12" font-weight="600" fill="#B45309" text-anchor="middle">toggleStatus 状态流转</text>
  <text x="820" y="286" font-size="10" fill="#D97706" text-anchor="middle">不可变更新 · 权限判断</text>
  <rect x="720" y="308" width="200" height="46" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
  <text x="820" y="328" font-size="12" font-weight="600" fill="#B45309" text-anchor="middle">isValidItem 合法性护栏</text>
  <text x="820" y="344" font-size="10" fill="#D97706" text-anchor="middle">持久层读取时逐条校验</text>
  <text x="820" y="392" font-size="10" fill="#94A3B8" text-anchor="middle">js/core.js · 不碰 DOM 与存储</text>
  <text x="820" y="408" font-size="10" fill="#94A3B8" text-anchor="middle">node --test 31 个用例直测</text>

  <!-- localStorage -->
  <rect x="400" y="462" width="220" height="56" rx="12" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="510" y="486" font-size="13" font-weight="600" fill="#047857" text-anchor="middle">浏览器 localStorage</text>
  <text x="510" y="504" font-size="10" fill="#059669" text-anchor="middle">键 campus-lostfound.v1 · 刷新不丢</text>

  <!-- 箭头：页面 ⇄ 持久层 -->
  <path d="M 270 215 L 376 215" stroke="#2563EB" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 376 245 L 270 245" stroke="#2563EB" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="323" y="205" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">读 / 写</text>
  <text x="323" y="268" font-size="11" fill="#2563EB" text-anchor="middle">同一份数据</text>

  <!-- 箭头：持久层 ⇄ 规则层 -->
  <path d="M 640 215 L 696 215" stroke="#94A3B8" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrGray)"/>
  <path d="M 696 245 L 640 245" stroke="#94A3B8" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrGray)"/>
  <text x="668" y="205" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">调用规则</text>
  <text x="668" y="268" font-size="11" fill="#64748B" text-anchor="middle">返回结果</text>

  <!-- 箭头：页面 → 规则层（页面直接调用校验/检索） -->
  <path d="M 270 150 C 420 110, 560 110, 696 150" stroke="#94A3B8" stroke-width="1.5" fill="none" stroke-dasharray="3 4" marker-end="url(#arrGray)"/>
  <text x="490" y="96" font-size="10" fill="#64748B" text-anchor="middle">页面也直接调用校验 / 检索纯函数</text>

  <!-- 箭头：持久层 → localStorage -->
  <path d="M 510 420 L 510 458" stroke="#2563EB" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="530" y="444" font-size="11" font-weight="600" fill="#2563EB">持久化</text>

  <!-- 底部结论 -->
  <rect x="40" y="462" width="300" height="56" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="190" y="486" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">状态更新后无需同步逻辑</text>
  <text x="190" y="504" font-size="10" fill="#64748B" text-anchor="middle">首页 / 搜索 / 详情 / 我的发布天然显示同一状态</text>
</svg>
