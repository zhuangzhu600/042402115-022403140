<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" font-family="PingFang SC, Microsoft YaHei, Hiragino Sans GB, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="980" height="720" fill="#F8FAFC"/>
  <text x="40" y="38" font-size="18" font-weight="700" fill="#0F172A">校园失物招领 · 核心业务流程</text>

  <!-- ═══ ① 使用主线 ═══ -->
  <text x="40" y="76" font-size="13" font-weight="700" fill="#64748B">① 使用主线：发现与联系</text>

  <rect x="40" y="92" width="100" height="56" rx="28" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="90" y="125" font-size="14" font-weight="600" fill="#1D4ED8" text-anchor="middle">打开网页</text>

  <rect x="200" y="62" width="180" height="52" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="290" y="84" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle">首页浏览</text>
  <text x="290" y="102" font-size="11" fill="#64748B" text-anchor="middle">全部 / 失物 / 招领筛选</text>

  <rect x="200" y="128" width="180" height="52" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="290" y="150" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle">搜索</text>
  <text x="290" y="168" font-size="11" fill="#64748B" text-anchor="middle">关键词 + 分类 + 只看进行中</text>

  <rect x="450" y="92" width="160" height="56" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="530" y="116" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle">查看详情</text>
  <text x="530" y="134" font-size="11" fill="#64748B" text-anchor="middle">复制联系方式</text>

  <rect x="680" y="92" width="190" height="56" rx="28" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="775" y="116" font-size="13" font-weight="600" fill="#047857" text-anchor="middle">线下联系</text>
  <text x="775" y="134" font-size="11" fill="#059669" text-anchor="middle">物品找回 / 归还</text>

  <path d="M 140 106 L 196 90" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 140 134 L 196 150" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 380 88 L 446 112" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 380 154 L 446 128" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 610 120 L 676 120" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ═══ ② 发布流程 ═══ -->
  <text x="40" y="250" font-size="13" font-weight="700" fill="#64748B">② 发布流程</text>

  <rect x="40" y="272" width="150" height="56" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="115" y="296" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle">发布信息</text>
  <text x="115" y="314" font-size="11" fill="#64748B" text-anchor="middle">选择寻物 / 招领</text>

  <rect x="250" y="272" width="180" height="56" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="340" y="296" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle">填写表单</text>
  <text x="340" y="314" font-size="11" fill="#64748B" text-anchor="middle">标题 / 分类 / 地点 / 联系方式</text>

  <polygon points="560,264 650,300 560,336 470,300" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="560" y="305" font-size="13" font-weight="600" fill="#B45309" text-anchor="middle">校验通过？</text>

  <rect x="470" y="392" width="180" height="52" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="560" y="414" font-size="13" font-weight="600" fill="#B91C1C" text-anchor="middle">标红提示，阻止提交</text>
  <text x="560" y="432" font-size="11" fill="#DC2626" text-anchor="middle">必填缺失 / 超长 / 非法分类</text>

  <rect x="730" y="272" width="180" height="56" rx="12" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="820" y="296" font-size="13" font-weight="600" fill="#047857" text-anchor="middle">发布成功</text>
  <text x="820" y="314" font-size="11" fill="#059669" text-anchor="middle">写入本地存储，各页面可见</text>

  <path d="M 190 300 L 246 300" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 430 300 L 466 300" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 650 300 L 726 300" stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="682" y="290" font-size="12" font-weight="600" fill="#2563EB">是</text>
  <path d="M 560 336 L 560 388" stroke="#DC2626" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="572" y="368" font-size="12" font-weight="600" fill="#DC2626">否</text>
  <path d="M 470 418 L 340 418 L 340 332" stroke="#94A3B8" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="352" y="412" font-size="11" fill="#64748B">返回修改</text>

  <!-- ═══ ③ 状态维护 ═══ -->
  <text x="40" y="500" font-size="13" font-weight="700" fill="#64748B">③ 状态维护（减少重复询问）</text>

  <rect x="40" y="522" width="150" height="56" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="115" y="546" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle">我的发布</text>
  <text x="115" y="564" font-size="11" fill="#64748B" text-anchor="middle">或自己的详情页</text>

  <rect x="250" y="522" width="180" height="56" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="340" y="546" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle">标记已找到 / 已归还</text>
  <text x="340" y="564" font-size="11" fill="#64748B" text-anchor="middle">寻物→已找到 招领→已归还</text>

  <polygon points="560,514 650,550 560,586 470,550" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="560" y="555" font-size="13" font-weight="600" fill="#B45309" text-anchor="middle">本人发布？</text>

  <rect x="450" y="640" width="220" height="52" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="560" y="662" font-size="13" font-weight="600" fill="#B91C1C" text-anchor="middle">提示：只能修改自己发布的信息</text>
  <text x="560" y="680" font-size="11" fill="#DC2626" text-anchor="middle">不静默失败</text>

  <rect x="730" y="522" width="190" height="56" rx="12" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="825" y="546" font-size="13" font-weight="600" fill="#047857" text-anchor="middle">更新状态并持久化</text>
  <text x="825" y="564" font-size="11" fill="#059669" text-anchor="middle">首页 / 搜索 / 详情同步显示</text>

  <path d="M 190 550 L 246 550" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 430 550 L 466 550" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 650 550 L 726 550" stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="682" y="540" font-size="12" font-weight="600" fill="#2563EB">是</text>
  <path d="M 560 586 L 560 636" stroke="#DC2626" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="572" y="616" font-size="12" font-weight="600" fill="#DC2626">否</text>
</svg>
